name: Lint Swift Files
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/lint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"
jobs:
  swiftlint:
    if: '!github.event.pull_request.merged'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download pinned SwiftLint
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output build/tools/swiftlint.zip
          printf '%s  %s\n' \
            c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0 \
            build/tools/swiftlint.zip > build/tools/checksums.txt
          shasum -a 256 --check build/tools/checksums.txt
          unzip -q build/tools/swiftlint.zip -d build/tools/swiftlint
      - name: Run SwiftLint
        run: |
          build/tools/swiftlint/swiftlint lint --no-cache --strict
          build/tools/swiftlint/swiftlint lint --no-cache --strict Shared MenuBarItemService Tests
